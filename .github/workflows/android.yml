name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: goal-keeper-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # Renders the Compose screens with Robolectric and commits the PNGs to docs/screenshots.
      - name: Record screenshots
        if: github.event_name == 'push'
        run: ./gradlew --stacktrace :app:recordRoborazziDebug

      - name: Commit screenshots
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- docs/screenshots)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots
            git commit -m "Update app screenshots [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME" || echo "Screenshot push skipped (branch moved on)"
          fi
